<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- on a home screen the house is called by its name, not by whichever
         piece's page happened to be open when it was added -->
    <meta name="apple-mobile-web-app-title" content="Hosha Stone" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- The house says its name in the dark at its own front door, once a
         visit (src/components/showroom/Showroom.jsx). It is drawn from here,
         not from the script, so it starts as soon as the page arrives and the
         script loads while it plays — on a phone that is most of the wait.
         Anywhere else, on a second visit or with motion turned down, it stays
         out of the way (hs-quiet). -->
    <script>
      try {
        var p = location.pathname.replace(/\/+$/, '')
        if (/^\/(browse|saved|story|piece\/[\w-]+)$/.test(p) || location.hash || sessionStorage.getItem('hs-opened') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches)
          document.documentElement.classList.add('hs-quiet')
      } catch (e) {}
    </script>
    <style>
      #hs-opening { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgb(var(--o-bg)); color: rgb(var(--o-ink)); pointer-events: none }
      .hs-quiet #hs-opening { display: none }
      #hs-opening .o-name { display: flex; overflow: hidden; white-space: nowrap; padding-left: 0.28em; font: 400 clamp(1.55rem, 6.2vw, 5rem) / 1 'Playfair Display', Georgia, serif; letter-spacing: 0.28em }
      #hs-opening .o-name span { display: inline-block; animation: o-rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) both }
      #hs-opening .o-rule { display: block; margin-top: 1.75rem; height: 1px; width: 6rem; background: rgb(var(--o-neon)); box-shadow: 0 0 12px rgb(var(--o-neon) / 0.8); animation: o-draw 1s cubic-bezier(0.65, 0, 0.35, 1) 0.55s both }
      #hs-opening .o-line { display: block; margin-top: 1.5rem; font: 400 10px / 1.4 Inter, system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.42em; color: rgb(var(--o-ink) / 0.6); animation: o-up 0.8s cubic-bezier(0.33, 1, 0.68, 1) 0.85s both }
      @keyframes o-rise { from { transform: translateY(110%); opacity: 0 } }
      @keyframes o-draw { from { transform: scaleX(0) } }
      @keyframes o-up { from { transform: translateY(8px); opacity: 0 } }
    </style>

    <!-- The house's defaults. A server replaces this block with the page's own
         title, words and card — see server/meta.js — because a scraper reads
         the HTML and never runs the site. Without a server these stand. -->
    <!--hs:meta-->
    <meta name="theme-color" content="#05041a" />
    <title>Hosha Stone — Simple. Never ordinary.</title>
    <meta name="description" content="A small number of garments each season. More than just clothes — pieces that stay simple, and are never ordinary." />
    <meta property="og:site_name" content="Hosha Stone" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hosha Stone — Simple. Never ordinary." />
    <meta property="og:description" content="A small number of garments each season. More than just clothes — pieces that stay simple, and are never ordinary." />
    <meta property="og:image" content="/share-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hosha Stone — Simple. Never ordinary." />
    <meta name="twitter:description" content="A small number of garments each season. More than just clothes — pieces that stay simple, and are never ordinary." />
    <meta name="twitter:image" content="/share-card.jpg" />
    <link rel="preload" as="image" href="/midnight-hero.webp" fetchpriority="high" />
    <!--/hs:meta-->

    <!-- the two faces every page draws, fetched alongside the page rather than
         discovered later inside the stylesheet (src/fonts.css) -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-normal-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/playfair-display-normal-latin.woff2" crossorigin />
  </head>
  <body>
    <!--hs:opening-->
    <div id="hs-opening" aria-hidden="true" style="--o-bg: 2 8 10; --o-ink: 240 246 246; --o-neon: 64 206 196">
      <div><span class="o-name"><span style="animation-delay:0.15s">H</span><span style="animation-delay:0.20s">O</span><span style="animation-delay:0.25s">S</span><span style="animation-delay:0.30s">H</span><span style="animation-delay:0.35s">A</span><span style="animation-delay:0.40s">&nbsp;</span><span style="animation-delay:0.45s">S</span><span style="animation-delay:0.50s">T</span><span style="animation-delay:0.55s">O</span><span style="animation-delay:0.60s">N</span><span style="animation-delay:0.65s">E</span></span></div>
      <div><span class="o-rule"></span></div>
      <div><span class="o-line">Simple. Never ordinary.</span></div>
    </div>
    <!--/hs:opening-->
    <a
      href="#main"
      style="position:fixed;left:-9999px;top:0;z-index:200;padding:14px 20px;background:#05041a;color:#f4f2f7;font:500 11px/1 Inter,system-ui,sans-serif;letter-spacing:0.22em;text-transform:uppercase;text-decoration:none"
      onfocus="this.style.left='12px';this.style.top='12px'"
      onblur="this.style.left='-9999px'"
      >Skip to the pieces</a
    >
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
